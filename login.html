<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Entrar</title>
    <link rel="shortcut icon" href="assets/icons/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="css/login.css">

</head>

<body class="pagina-login">

    <!-- Cabeçalho-->
    <header>

        <div class="header">
            <div class="logo">
                <a href="index.html">
                    <img src="assets/img/logo-netflix.png" alt="Logo Netflix">
                </a>
            </div>


            <div class="header-login>
                <a href="#">Entrar</a>
            </div>
        </div>
    </header>

    <main>

        <section class="login-section">

            <div class="login-container">

                <h1>Entrar</h1>

                <form action="#" method="get">

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required>
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="senha" required>
                    </div>

                    <button type="submit">Entrar</button>

                    <div class="checkbox-group">
                        <input type="checkbox" id="lembrar" name="lembrar">
                        <label for="lembrar">Lembrar de mim</label>
                    </div>

                    <div class="forgot-password">
                        <a href="#">Esqueceu sua senha?</a>
                    </div>
                </form>

                <p class="criar-conta">Ainda não possui uma conta? <a href="#">Assine agora</a></p>
            </div>

        </section>

    </main>


    <footer>

        <div class="direitos-autorais">
            <p>© 1997 - 2026 Netflix, Inc.</p>
        </div>

    </footer>


</body>

</html>
