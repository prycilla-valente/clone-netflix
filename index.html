<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Início</title>
    <link rel="shortcut icon" href="assets/icons/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <!-- Cabeçalho-->
    <header>

        <div class="header">
            <div class="logo">
                <a href="index.html"><img src="assets/img/logo-netflix.png" alt="Logo Netflix"></a>
                
            </div>

            <nav class="menu-navegacao">
                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Séries</a></li>
                    <li><a href="#">Filmes</a></li>
                   
                </ul>
            </nav>

            <div class="login">
                <a href="pages/login.html">Entrar</a>
            </div>
        </div>
    </header>

    <main>
        <!--Banner principal-->
        <section class="hero">
            <div class="banner">
                <img src="assets/img/netflix-capa2.png" alt="imagem-de-fundo">
                <h1>Filmes, séries e muito mais, sem limites</h1>
                <p>A partir de <strong>R$ 20,90.</strong> Cancele quando quiser.</p>
                <p>Quer assistir? Informe seu email para criar ou reiniciar sua assinatura</p>
            </div>

            <form action="">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Email" required>
                <button type="submit">Vamos lá > </button>
            </form>

            <div class="botoes">
                <a href="login.html" class="btn-1">Assistir</a>
                <a href="#" class="btn-2">Mais informações</a>
            </div>

        </section>
